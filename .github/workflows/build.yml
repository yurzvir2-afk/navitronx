name: Build NavitronX APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
      - name: Fix and Build
        run: |
          rm -rf android
          flutter create. --platforms=android --overwrite
          printf "name: navitronx\ndescription: NavitronX\npublish_to: 'none'\nversion: 11.0.0+1\nenvironment:\n sdk: '>=3.2.0 <4.0.0'\ndependencies:\n flutter:\n sdk: flutter\nflutter:\n uses-material-design: true\n" > pubspec.yaml
          mkdir -p lib
          printf "import 'package:flutter/material.dart';\nvoid main()=>runApp(MaterialApp(home:Scaffold(appBar:AppBar(title:Text('NavitronX v11 FINAL')),body:Center(child:Text('NavitronX v11\nMAP 22x\nGPS Galileo\nAI Chat\nMarket',textAlign:TextAlign.center,style:TextStyle(fontSize:24))))));\n" > lib/main.dart
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: NavitronX-APK-FINAL
          path: build/app/outputs/flutter-apk/app-release.apk
