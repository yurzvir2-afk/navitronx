name: Build NavitronX APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
      - name: Create Android and Fix Files
        run: |
          flutter create --platforms=android --project-name navitronx temp_app
          rm -rf android
          mv temp_app/android./
          rm -rf temp_app
          cat > pubspec.yaml << 'EOF'
          name: navitronx
          description: NavitronX v11 FINAL
          publish_to: 'none'
          version: 11.0.0+1
          environment:
            sdk: '>=3.2.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.6
          dev_dependencies:
            flutter_test:
              sdk: flutter
          flutter:
            uses-material-design: true
          EOF
          mkdir -p lib
          cat > lib/main.dart << 'EOF'
          import 'package:flutter/material.dart';
          void main()=>runApp(const NavitronX());
          class NavitronX extends StatelessWidget{
          const NavitronX({super.key});
          @override Widget build(BuildContext context){
          return MaterialApp(title:'NavitronX v11 FINAL',theme:ThemeData(useMaterial3:true,colorSchemeSeed:Colors.green),home:const MapPage());}}
          class MapPage extends StatefulWidget{const MapPage({super.key});@override State<MapPage> createState()=>_MapPageState();}
          class _MapPageState extends State<MapPage>{
          int idx=0;
          @override Widget build(BuildContext context){
          final pages=[
          Container(color:Colors.green[50],child:const Center(child:Text('🗺️ NavitronX v11\n\n✅ ULTRA MAP 22x\n✅ Satellite 1.4m\n✅ GPS+Galileo\n✅ Live Roads 30s\n✅ Voice 32 langs\nSK CZ PL HU DE UA EN',textAlign:TextAlign.center,style:TextStyle(fontSize:20,fontWeight:FontWeight.bold)))),
          const Center(child:Text('🔍 AI SEARCH\n"where to sleep with truck 4m 50e shower near D1?"',textAlign:TextAlign.center,style:TextStyle(fontSize:18))),
          const Center(child:Text('🤖 AI ASSISTANT\nЗнає маршрут, AETR, погоду',textAlign:TextAlign.center,style:TextStyle(fontSize:18))),
          const Center(child:Text('💬 CHAT\nГрупи по маршруту D1 LIVE 127 водіїв',textAlign:TextAlign.center,style:TextStyle(fontSize:18))),
          const Center(child:Text('🛒 MARKETPLACE\nВіньєтки AT 9.90e HU CZ SK SI',textAlign:TextAlign.center,style:TextStyle(fontSize:18))),
          ];
          return Scaffold(
          appBar:AppBar(title:const Text('NavitronX v11 FINAL ALL IN ONE'),centerTitle:true,backgroundColor:Colors.green),
          body:pages[idx],
          bottomNavigationBar:NavigationBar(selectedIndex:idx,onDestinationSelected:(i)=>setState(()=>idx=i),destinations:const[
          NavigationDestination(icon:Icon(Icons.map),label:'Map'),
          NavigationDestination(icon:Icon(Icons.search),label:'AI Search'),
          NavigationDestination(icon:Icon(Icons.smart_toy),label:'AI'),
          NavigationDestination(icon:Icon(Icons.chat),label:'Chat'),
          NavigationDestination(icon:Icon(Icons.shopping_cart),label:'Market')]),
          floatingActionButton:FloatingActionButton.extended(onPressed:(){ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content:Text('🧭 Навігація старт! GPS+Galileo 1.4m')));},label:const Text('START NAVIGATION'),icon:const Icon(Icons.navigation),backgroundColor:Colors.green),
          );}}
          EOF
      - run: flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: NavitronX-APK-FINAL
          path: build/app/outputs/flutter-apk/app-release.apk
